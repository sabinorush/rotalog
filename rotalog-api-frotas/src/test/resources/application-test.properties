# RotaLog - API Frotas - Configuração de testes (@DataJpaTest)
#
# Banco em memória H2, em modo de compatibilidade PostgreSQL, usado apenas para
# os testes de repository. O projeto não usa Testcontainers (decisão explícita:
# sem novas dependências pesadas / Docker durante `mvn test`).
#
# MODE=PostgreSQL aproxima o comportamento do H2 do Postgres real (inclusive
# dobra identificadores não-citados para minúsculas, como o Postgres faz),
# o que é importante aqui porque as queries nativas do projeto (ex.:
# MotoristaRepository#findMotoristasDisponiveis) referenciam tabelas/colunas
# em minúsculas sem aspas.
spring.datasource.url=jdbc:h2:mem:frotas_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Sem Flyway nos testes de repository: o schema é gerado pelo próprio Hibernate
# a partir das entidades (create-drop), já que o V1/V2/V3 do Flyway usam
# sintaxe específica do Postgres (BIGSERIAL) e o Flyway já vem desabilitado
# em produção (application.properties) em favor dos scripts do docker-compose.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Sobrescreve o default_schema=frotas do application.properties principal: o H2
# em memória usa o schema PUBLIC por padrão, e as queries nativas dos
# repositories (ex.: findMotoristasDisponiveis) não qualificam schema, então
# precisam bater com o schema onde o Hibernate efetivamente criou as tabelas.
spring.jpa.properties.hibernate.default_schema=PUBLIC

logging.level.org.hibernate.SQL=WARN
